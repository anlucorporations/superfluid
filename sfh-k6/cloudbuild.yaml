# Cloud Build — imagen de carga k6
substitutions:
  _REGION: europe-west1
  _REPO: sfhostpot
  _TAG: latest
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/k6:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/k6:${_TAG}
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/k6:${_TAG}
