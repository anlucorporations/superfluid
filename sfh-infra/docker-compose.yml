# =============================================================================
# docker-compose local — SFhostpot (RNF-14)
# =============================================================================
# Stack completo de desarrollo: PostgreSQL + FreeRADIUS + orquestador + portal.
# Uso:  docker compose -f sfh-infra/docker-compose.yml up -d --build
# =============================================================================
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sfhostpot
      POSTGRES_USER: sfh
      POSTGRES_PASSWORD: sfh_dev_password
    ports: ['5432:5432']
    volumes:
      - sfh_pgdata:/var/lib/postgresql/data
      - ../sfh-orchestrator/migrations/0001_base_datos.sql:/docker-entrypoint-initdb.d/0001_base_datos.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sfh -d sfhostpot']
      interval: 5s
      timeout: 3s
      retries: 20

  freeradius:
    image: freeradius/freeradius-server:3.2
    ports:
      - '1812:1812/udp'
      - '1813:1813/udp'
      - '3799:3799/udp'
    volumes:
      - ./freeradius/clients.conf:/etc/freeradius/3.0/clients.conf:ro
      - ./freeradius/users:/etc/freeradius/3.0/mods-config/files/authorize:ro

  orchestrator:
    build:
      context: ../sfh-orchestrator
    environment:
      NODE_ENV: development
      API_PORT: '8080'
      DATABASE_URL: postgresql://sfh:sfh_dev_password@postgres:5432/sfhostpot
      RPC_URL: https://besu.alumnos.codecrypto.academy
      CHAIN_ID: '81234'
      JWT_SECRET: dev-only-change-me-please-32chars
      INTERNAL_SECRET: dev-internal-secret
      API_KEY_PEPPER: dev-pepper-change-me
      GATEWAY_HMAC_SECRETS: gid-demo=secreto-demo-cambiame
      CLOUD_TASKS_PROJECT: ''
    ports: ['8080:8080']
    depends_on:
      postgres: { condition: service_healthy }

  portal:
    build:
      context: ../sfh-portal
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_RPC_URL: https://besu.alumnos.codecrypto.academy
      NEXT_PUBLIC_CHAIN_ID: '81234'
    ports: ['3000:3000']
    depends_on: [orchestrator]

volumes:
  sfh_pgdata:
