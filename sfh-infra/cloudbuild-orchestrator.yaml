# Cloud Build — imagen del orquestador (Cloud Run / Cloud Run Jobs)
# Uso:
#   gcloud builds submit sfh-orchestrator --project=truekeate-main \
#     --config=sfh-infra/cloudbuild-orchestrator.yaml \
#     --substitutions=_TAG=preview-YYYYMMDD
substitutions:
  _REGION: europe-west1
  _REPO: sfhostpot
  _TAG: latest
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/orchestrator:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/orchestrator:${_TAG}']
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/orchestrator:${_TAG}
