# Cloud Build — smoke E2E del preview (Cloud Run API ↔ Cloud SQL)
# Uso:
#   gcloud builds submit sfh-infra/smoke --project=truekeate-main \
#     --config=sfh-infra/smoke/cloudbuild.yaml \
#     --substitutions=_API_URL=https://sfh-orchestrator-XXXX.southamerica-east1.run.app
substitutions:
  _API_URL: https://sfh-orchestrator-m33mjctj4a-rj.a.run.app
availableSecrets:
  secretManager:
    - versionName: projects/truekeate-main/secrets/sfhostpot-preview-api-key/versions/latest
      env: API_KEY
    - versionName: projects/truekeate-main/secrets/sfhostpot-gateway-hmac/versions/latest
      env: HMAC_RAW
steps:
  - name: node:22-alpine
    entrypoint: node
    args: [preview_smoke.mjs]
    env:
      - API_URL=${_API_URL}
    secretEnv: [API_KEY, HMAC_RAW]
