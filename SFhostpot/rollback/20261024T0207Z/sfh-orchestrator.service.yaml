apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/maxScale: '20'
    run.googleapis.com/urls: '["https://sfh-orchestrator-593453426217.southamerica-east1.run.app","https://sfh-orchestrator-m33mjctj4a-rj.a.run.app"]'
  labels:
    cloud.googleapis.com/location: southamerica-east1
    run.googleapis.com/satisfiesPzs: 'true'
  name: sfh-orchestrator
  namespace: '593453426217'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '3'
        run.googleapis.com/client-name: gcloud
        run.googleapis.com/client-version: 582.0.0
        run.googleapis.com/cloudsql-instances: truekeate-main:southamerica-east1:truekeate-db-dev
        run.googleapis.com/startup-cpu-boost: 'true'
      labels:
        client.knative.dev/nonce: simlgfcbiv
        run.googleapis.com/startupProbeType: Default
    spec:
      containerConcurrency: 80
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: CHAIN_ID
          value: '81234'
        - name: RPC_URL
          value: https://besu.alumnos.codecrypto.academy
        - name: SUPER_TOKEN_ADDRESS
          value: '0x6540b8f49168c6896d85f05b5ca8AdAaaEB65be0'
        - name: UNDERLYING_ADDRESS
          value: '0x99aA73dA6309b8eC484eF2C95e96C131C1BBF7a0'
        - name: MEMPOOL_MODE
          value: receipt
        - name: GATEWAY_RUNTIME_CONFIGS
          value: '[{"id":"11111111-1111-4111-8111-111111111111","vendor":"mikrotik_rest","mikrotik":{"baseUrl":"https://sfh-sim-routeros-m33mjctj4a-rj.a.run.app","username":"sfh","password":"<REDACTED:sfhostpot-sim-password>","timeoutMs":2000,"addressList":"sfh-authorized","platformAuth":"cloudrun"}}]'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: latest
              name: sfhostpot-db-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: sfhostpot-jwt-secret
        - name: INTERNAL_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: sfhostpot-internal-secret
        - name: API_KEY_PEPPER
          valueFrom:
            secretKeyRef:
              key: latest
              name: sfhostpot-api-key-pepper
        - name: GATEWAY_HMAC_SECRETS
          valueFrom:
            secretKeyRef:
              key: latest
              name: sfhostpot-gateway-hmac
        - name: RATE_LIMIT_MAX
          value: '1000000'
        - name: RATE_LIMIT_WINDOW_MS
          value: '60000'
        - name: CORS_ORIGIN
          value: https://sfh-portal-m33mjctj4a-rj.a.run.app
        - name: DB_POOL_MAX
          value: '4'
        image: europe-west1-docker.pkg.dev/truekeate-main/sfhostpot/orchestrator:preview-20261023-v6
        ports:
        - containerPort: 8080
          name: http1
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          failureThreshold: 1
          periodSeconds: 240
          tcpSocket:
            port: 8080
          timeoutSeconds: 240
      serviceAccountName: sfh-orchestrator@truekeate-main.iam.gserviceaccount.com
      timeoutSeconds: 300
  traffic:
  - latestRevision: true
    percent: 100
