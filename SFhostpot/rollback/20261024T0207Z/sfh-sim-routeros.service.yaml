apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/maxScale: '20'
    run.googleapis.com/urls: '["https://sfh-sim-routeros-593453426217.southamerica-east1.run.app","https://sfh-sim-routeros-m33mjctj4a-rj.a.run.app"]'
  labels:
    cloud.googleapis.com/location: southamerica-east1
    run.googleapis.com/satisfiesPzs: 'true'
  name: sfh-sim-routeros
  namespace: '593453426217'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/client-name: gcloud
        run.googleapis.com/client-version: 582.0.0
        run.googleapis.com/startup-cpu-boost: 'true'
      labels:
        client.knative.dev/nonce: twzzpbnjzh
        run.googleapis.com/startupProbeType: Default
    spec:
      containerConcurrency: 80
      containers:
      - env:
        - name: SFH_SIM_USER
          value: sfh
        - name: SFH_SIM_HOST
          value: 0.0.0.0
        - name: SFH_SIM_PORT
          value: '8728'
        - name: SFH_SIM_PASSWORD
          valueFrom:
            secretKeyRef:
              key: latest
              name: sfhostpot-sim-password
        - name: SFH_SIM_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              key: latest
              name: sfhostpot-sim-admin-token
        image: europe-west1-docker.pkg.dev/truekeate-main/sfhostpot/sim:preview-20261023-v3
        ports:
        - containerPort: 8728
          name: http1
        resources:
          limits:
            cpu: '1'
            memory: 256Mi
        startupProbe:
          failureThreshold: 1
          periodSeconds: 240
          tcpSocket:
            port: 8728
          timeoutSeconds: 240
      serviceAccountName: 593453426217-compute@developer.gserviceaccount.com
      timeoutSeconds: 300
  traffic:
  - latestRevision: true
    percent: 100
