[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
gas_reports = ["Brlt", "BrltX"]
fs_permissions = [{access = "read-write", path = "./deployments"}]

[lint]
lint_on_build = false

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"
