[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
fuzz = { runs = 1000 }
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[rpc_endpoints]
besu = "${RPC_URL}"

# Red privada académica: sin explorador; verificación on-chain no aplica.
