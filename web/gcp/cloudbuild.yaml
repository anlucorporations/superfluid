# H7 — Cloud Build: imagen multi-stage + despliegue en Cloud Run.
# Comando:
#   gcloud builds submit web \
#     --project opencode-txbarlovento \
#     --config web/gcp/cloudbuild.yaml \
#     --substitutions _IMAGE=europe-west1-docker.pkg.dev/opencode-txbarlovento/superfluidv2/web:latest,_SERVICE=brltv2,_REGION=europe-west1
steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    entrypoint: "docker"
    args:
      - "build"
      - "--build-arg"
      - "NEXT_PUBLIC_RPC_URL=https://besu.alumnos.codecrypto.academy"
      - "--build-arg"
      - "NEXT_PUBLIC_CHAIN_ID=81234"
      - "--build-arg"
      - "NEXT_PUBLIC_BRLT_ADDRESS=0x750508AD02404a30dF030466FBb3a29D9EE0482F"
      - "--build-arg"
      - "NEXT_PUBLIC_BRLTX_ADDRESS=0xCE5E017599073f60b3518Cf2f86fFdd49bc6e52F"
      - "--build-arg"
      - "NEXT_PUBLIC_FAUCET_URL=https://faucet.codecrypto.academy/"
      - "-t"
      - "$_IMAGE"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    entrypoint: "docker"
    args: ["push", "$_IMAGE"]
  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy "$_SERVICE" \
          --project "$PROJECT_ID" \
          --region "$_REGION" \
          --image "$_IMAGE" \
          --port 8080 \
          --min-instances 1 --max-instances 2 \
          --cpu 1 --memory 512Mi \
          --timeout 120s \
          --allow-unauthenticated \
          --vpc-connector brltv2-connector --vpc-egress all-traffic \
          --set-secrets "MONGODB_URI=brltv2-mongo-uri:latest" \
          --set-env-vars "SIWE_DOMAIN=brltv2-crx2qw5whq-ew.a.run.app,MONGODB_DB=superfluid,DISABLE_JOBS=0,ADMIN_BOOTSTRAP_WALLET=0x347789cf559a68262e4A444bc251AF8d0bE07EA9"
images:
  - "$_IMAGE"
options:
  logging: CLOUD_LOGGING_ONLY
