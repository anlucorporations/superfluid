# H7 — Cloud Build: imagen multi-stage + despliegue en Cloud Run.
# Proyecto: plataforma-txbarlovento (cuenta sa-dsh-dev). Comando:
#   gcloud builds submit web \
#     --project plataforma-txbarlovento \
#     --config web/gcp/cloudbuild.yaml \
#     --substitutions _IMAGE=europe-west1-docker.pkg.dev/plataforma-txbarlovento/superfluidv2/web:latest,_SERVICE=brltv2,_REGION=europe-west1,_CONNECTOR=brltv2-connector
steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    entrypoint: "docker"
    args:
      - "build"
      - "--build-arg"
      - "NEXT_PUBLIC_RPC_URL=https://hotel-anvil-proxy-szrmcf2hja-ew.a.run.app"
      - "--build-arg"
      - "NEXT_PUBLIC_CHAIN_ID=31337"
      - "--build-arg"
      - "NEXT_PUBLIC_BRLT_ADDRESS=0x020a699264d9f9caed6f0b65c1c25F000E7d6b56"
      - "--build-arg"
      - "NEXT_PUBLIC_BRLTX_ADDRESS=0x6080788bc70756dD3c73b4AF2936D0eeA135bE71"
      - "--build-arg"
      - "NEXT_PUBLIC_FAUCET_URL=https://faucet.codecrypto.academy/"
      - "-t"
      - "$_IMAGE"
      - "."
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    entrypoint: "docker"
    args: ["push", "$_IMAGE"]
  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy "$_SERVICE" \
          --project "$PROJECT_ID" \
          --region "$_REGION" \
          --image "$_IMAGE" \
          --port 8080 \
          --min-instances 1 --max-instances 2 \
          --cpu 1 --memory 512Mi \
          --timeout 120s \
          --allow-unauthenticated \
          --vpc-connector "$_CONNECTOR" --vpc-egress all-traffic \
          --set-secrets "MONGODB_URI=brltv2-mongo-uri:latest" \
          --set-env-vars "SIWE_DOMAIN=brltv2-szrmcf2hja-ew.a.run.app,MONGODB_DB=superfluid_anvil,SESSION_TTL_ADMIN_SECONDS=7200,SESSION_TTL_EMPLOYEE_SECONDS=28800,AUTH_RATE_LIMIT=5,AUTH_RATE_WINDOW_SECONDS=900,ADMIN_BOOTSTRAP_WALLET=0xb4eCE9a93c2d400e4322EfFF9Ae9dA284aD200DF,NEXT_PUBLIC_RPC_URL=https://hotel-anvil-proxy-szrmcf2hja-ew.a.run.app,NEXT_PUBLIC_CHAIN_ID=31337,NEXT_PUBLIC_BRLT_ADDRESS=0x020a699264d9f9caed6f0b65c1c25F000E7d6b56,NEXT_PUBLIC_BRLTX_ADDRESS=0x6080788bc70756dD3c73b4AF2936D0eeA135bE71,NEXT_PUBLIC_FAUCET_URL=https://faucet.codecrypto.academy/,DISABLE_JOBS=0"
images:
  - "$_IMAGE"
options:
  logging: CLOUD_LOGGING_ONLY
