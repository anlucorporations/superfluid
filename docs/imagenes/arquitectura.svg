<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="system-ui,'Segoe UI',Arial" role="img" aria-label="Arquitectura del sistema Superfluid Brlt">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="ah2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1140"/><stop offset="1" stop-color="#3b2a7a"/>
    </linearGradient>
  </defs>
  <style>
    .bg{fill:#0d1425}.card{fill:#131c30;stroke:#2a3a5c;stroke-width:1.5}
    .zone{fill:#0f1a33;stroke:#1e2d4d;stroke-width:1.2;stroke-dasharray:6 5}
    .h1{font-size:22px;font-weight:700;fill:#e2e8f0}
    .h2{font-size:13px;fill:#94a3b8}
    .zoneT{font-size:12px;font-weight:700;fill:#a78bfa;letter-spacing:1px}
    .lbl{font-size:14.5px;font-weight:600;fill:#e2e8f0}
    .mut{font-size:12px;fill:#94a3b8}
    .tag{font-size:11px;fill:#64748b}
    .mini{fill:#1b1140;stroke:#8b5cf6;stroke-width:1.2}
    .minit{font-size:12.5px;font-weight:600;fill:#e2e8f0}
    .arr{stroke:#8b5cf6;stroke-width:2.2;fill:none;marker-end:url(#ar)}
    .arrd{stroke:#34d399;stroke-width:2.2;fill:none;marker-end:url(#ar)}
    .arrdash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#ar)}
    .lt{font-size:12px;fill:#94a3b8}
    .em{fill:#34d399;font-weight:700}
  </style>
  <rect class="bg" width="960" height="620"/>
  <text x="480" y="40" text-anchor="middle" class="h1">Arquitectura — Superfluid Brlt Streaming v2</text>
  <text x="480" y="62" text-anchor="middle" class="h2">El navegador firma · la app aplica la regla del 80% · la cadena guarda el dinero · MongoDB recuerda</text>

  <!-- Zona navegador -->
  <rect class="zone" x="35" y="90" width="270" height="230" rx="14"/>
  <text x="50" y="115" class="zoneT">NAVEGADOR</text>
  <rect class="card" x="55" y="130" width="230" height="80" rx="10"/>
  <text x="170" y="156" text-anchor="middle" class="lbl">MetaMask</text>
  <text x="170" y="176" text-anchor="middle" class="mut">firma SIWE y todos los cobros</text>
  <text x="170" y="194" text-anchor="middle" class="mut">nunca guarda claves</text>
  <rect class="card" x="55" y="222" width="230" height="80" rx="10"/>
  <text x="170" y="248" text-anchor="middle" class="lbl">Entrada /entrar</text>
  <text x="170" y="268" text-anchor="middle" class="mut">conecta wallet + pregunta el rol</text>
  <text x="170" y="286" text-anchor="middle" class="mut">admin · empleado · sin alta</text>

  <!-- Zona app web -->
  <rect class="zone" x="340" y="90" width="300" height="230" rx="14"/>
  <text x="355" y="115" class="zoneT">APP WEB (CLOUD RUN)</text>
  <rect class="mini" x="360" y="130" width="260" height="78" rx="10"/>
  <text x="490" y="152" text-anchor="middle" class="minit">Panel admin /admin</text>
  <text x="490" y="172" text-anchor="middle" class="mut">estilo AdminLTE (claro)</text>
  <text x="490" y="190" text-anchor="middle" class="mut">empleados · flujos · auditoría · jobs</text>
  <rect x="360" y="220" width="260" height="78" rx="10" fill="#131c30" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="490" y="242" text-anchor="middle" class="minit">Portal Empleado /suite</text>
  <text x="490" y="262" text-anchor="middle" class="mut">azul noche #0d1425 + violeta</text>
  <text x="490" y="280" text-anchor="middle" class="mut">downgrade con tope 80%</text>

  <!-- Zona cadena -->
  <rect class="zone" x="675" y="90" width="250" height="230" rx="14"/>
  <text x="690" y="115" class="zoneT">RED EVM (BESU/ANVIL)</text>
  <rect class="card" x="695" y="130" width="210" height="80" rx="10"/>
  <text x="800" y="156" text-anchor="middle" class="lbl">BRLT (token)</text>
  <text x="800" y="176" text-anchor="middle" class="mut">18 decimales · el dinero</text>
  <text x="800" y="194" text-anchor="middle" class="mut">supply · mint · burn</text>
  <rect class="card" x="695" y="222" width="210" height="80" rx="10"/>
  <text x="800" y="248" text-anchor="middle" class="lbl">BrltX (streaming)</text>
  <text x="800" y="268" text-anchor="middle" class="mut">wrap 1:1 · flujos · downgrade</text>
  <text x="800" y="286" text-anchor="middle" class="mut">eventos: Downgraded…</text>

  <!-- MongoDB -->
  <rect class="card" x="380" y="410" width="270" height="110" rx="12"/>
  <text x="515" y="440" text-anchor="middle" class="lbl">MongoDB</text>
  <text x="515" y="462" text-anchor="middle" class="mut">Empleados · Flujos · Historial · Jobs</text>
  <text x="515" y="482" text-anchor="middle" class="mut">Auditoría · Sesiones · <tspan class="em">Límites del tope</tspan></text>

  <!-- Regla -->
  <rect x="700" y="410" width="225" height="110" rx="12" fill="#0f2a24" stroke="#34d399" stroke-width="1.5"/>
  <text x="812" y="440" text-anchor="middle" class="lbl" style="fill:#34d399">Regla de oro</text>
  <text x="812" y="462" text-anchor="middle" class="mut">el contrato manda</text>
  <text x="812" y="482" text-anchor="middle" class="mut">MongoDB = copia reconciliada</text>

  <!-- flechas -->
  <path class="arr" d="M170,210 L170,222"/>
  <path class="arr" d="M287,215 L348,190"/>
  <path class="arr" d="M287,260 L348,258"/>
  <path class="arr" d="M620,170 L693,170"/>
  <text x="650" y="160" text-anchor="middle" class="lt">eth_call</text>
  <path class="arrd" d="M620,258 L693,258"/>
  <text x="645" y="242" text-anchor="middle" class="lt" style="fill:#34d399">downgrade</text>
  <text x="645" y="256" text-anchor="middle" class="lt" style="fill:#34d399">tope 80%</text>
  <path class="arrdash" d="M355,292 C280,355 120,335 150,214"/>
  <text x="240" y="382" text-anchor="middle" class="lt">validación continua de wallet</text>
  <path class="arr" d="M430,320 L455,408"/>
  <path class="arr" d="M560,320 L545,408"/>

  <!-- footer -->
  <text x="480" y="565" text-anchor="middle" class="mut">Toda escritura on-chain se firma en el navegador con MetaMask · el servidor aplica el tope del 80% antes de registrar el cobro.</text>
  <text x="480" y="590" text-anchor="middle" class="tag">docs/imagenes/arquitectura.svg · actualizado 2026-11-17</text>
</svg>
