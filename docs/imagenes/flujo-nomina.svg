<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="system-ui,'Segoe UI',Arial" role="img" aria-label="Ciclo de vida de un flujo de nómina">
  <defs>
    <marker id="fn" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="fh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1140"/><stop offset="1" stop-color="#3b2a7a"/>
    </linearGradient>
  </defs>
  <style>
    .bg{fill:#0d1425}.card{fill:#131c30;stroke:#2a3a5c;stroke-width:1.5}
    .h1{font-size:22px;font-weight:700;fill:#e2e8f0}
    .h2{font-size:13px;fill:#94a3b8}
    .lbl{font-size:15px;font-weight:700;fill:#e2e8f0}
    .mut{font-size:12.5px;fill:#94a3b8}
    .msg{font-size:12.5px;fill:#e2e8f0}
    .ret{fill:#34d399}
    .life{stroke:#334155;stroke-width:2;stroke-dasharray:6 6}
    .arrow{stroke:#8b5cf6;stroke-width:2;fill:none;marker-end:url(#fn)}
    .back{stroke:#34d399;stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#fn)}
    .step{font-size:11px;font-weight:700;fill:#a78bfa;letter-spacing:1px}
    .phase{fill:none;stroke:#334155;stroke-width:1.2}
    .phaseT{font-size:11.5px;font-weight:600;fill:#94a3b8}
  </style>
  <rect class="bg" width="960" height="620"/>
  <text x="480" y="40" text-anchor="middle" class="h1">Pausa, reanudación y cierre de una nómina (flujo #N)</text>
  <text x="480" y="63" text-anchor="middle" class="h2">Al pausar se guarda la tasa · al reanudar el fin se aplaza: nadie pierde devengo</text>

  <!-- participantes -->
  <rect class="card" x="110" y="90" width="210" height="56" rx="12"/>
  <rect x="110" y="90" width="210" height="56" rx="12" fill="url(#fh)"/>
  <text x="215" y="116" text-anchor="middle" class="lbl">Admin (MetaMask)</text>
  <text x="215" y="136" text-anchor="middle" class="mut">gestiona el grifo</text>
  <line x1="215" y1="146" x2="215" y2="560" class="life"/>

  <rect class="card" x="430" y="90" width="160" height="56" rx="12"/>
  <rect x="430" y="90" width="160" height="56" rx="12" fill="url(#fh)"/>
  <text x="510" y="124" text-anchor="middle" class="lbl">Contrato BrltX</text>
  <line x1="510" y1="146" x2="510" y2="560" class="life"/>

  <rect class="card" x="700" y="90" width="170" height="56" rx="12"/>
  <rect x="700" y="90" width="170" height="56" rx="12" fill="url(#fh)"/>
  <text x="785" y="124" text-anchor="middle" class="lbl">Empleado</text>
  <line x1="785" y1="146" x2="785" y2="560" class="life"/>

  <!-- 1 crear -->
  <text x="215" y="172" class="step">1 · CREAR</text>
  <path class="arrow" d="M215,196 L508,196"/>
  <text x="362" y="188" text-anchor="middle" class="msg">wrapAndCreateFlow(10 BRLT, 6 días)</text>
  <path class="back" d="M508,228 L218,228"/>
  <text x="362" y="220" text-anchor="middle" class="msg ret">FlowCreated #N (tasa floor)</text>

  <!-- 2 pausa -->
  <text x="215" y="262" class="step">2 · PAUSA</text>
  <path class="arrow" d="M215,286 L508,286"/>
  <text x="362" y="278" text-anchor="middle" class="msg">updateFlow(#N, 0) — pausa</text>
  <path class="back" d="M508,318 L782,318"/>
  <text x="650" y="310" text-anchor="middle" class="msg ret">liquida el tramo (minta BrltX)</text>
  <rect class="phase" x="330" y="336" width="360" height="30" rx="8"/>
  <text x="510" y="356" text-anchor="middle" class="phaseT">tasa congelada · el tiempo restante se aplaza al reanudar</text>

  <!-- 3 reanudar -->
  <text x="215" y="392" class="step">3 · REANUDAR</text>
  <path class="arrow" d="M215,416 L508,416"/>
  <text x="362" y="408" text-anchor="middle" class="msg">updateFlow(#N, tasa) — reanudar</text>

  <!-- 4 terminar -->
  <text x="215" y="450" class="step">4 · TERMINAR</text>
  <path class="arrow" d="M215,474 L508,474"/>
  <text x="362" y="466" text-anchor="middle" class="msg">deleteFlow(#N) — terminar</text>
  <path class="back" d="M508,508 L782,508"/>
  <text x="646" y="500" text-anchor="middle" class="msg ret">paga lo devengado al empleado</text>
  <path class="back" d="M508,540 L218,540"/>
  <text x="362" y="532" text-anchor="middle" class="msg ret">remanente vuelve al admin</text>

  <text x="480" y="585" text-anchor="middle" class="mut">el servidor lee getFlow y getPending para reconciliar el estado · nada se pierde</text>
  <text x="480" y="605" text-anchor="middle" font-size="11" fill="#64748b">docs/imagenes/flujo-nomina.svg · actualizado 2026-11-17</text>
</svg>
