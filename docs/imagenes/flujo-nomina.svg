<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui,Segoe UI,Arial" role="img" aria-label="Flujo de una nómina">
  <defs>
    <style>
      .t{font-size:20px;font-weight:600;fill:#0f172a}
      .s{font-size:13px;fill:#475569}
      .box{fill:#fff;stroke:#e2e8f0;stroke-width:2}
      .step{fill:#eef2ff;stroke:#6366f1;stroke-width:2}
      .ok{fill:#ecfdf5;stroke:#10b981}
      .money{fill:#fffbeb;stroke:#f59e0b}
      .lbl{font-size:14px;font-weight:600;fill:#1e293b}
      .lbl2{font-size:12px;fill:#475569}
      .arrow{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#ah2)}
    </style>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" class="t">Flujo de una nómina (6 días · 10 BRLT)</text>

  <rect x="30" y="80" width="180" height="90" rx="12" class="step"/>
  <text x="120" y="112" text-anchor="middle" class="lbl">1 · Crear</text>
  <text x="120" y="134" text-anchor="middle" class="lbl2">approve + wrapAndCreateFlow</text>
  <text x="120" y="154" text-anchor="middle" class="lbl2">deposita 10 BRLT en escrow</text>

  <rect x="270" y="80" width="180" height="90" rx="12" class="money"/>
  <text x="360" y="112" text-anchor="middle" class="lbl">2 · Acumular</text>
  <text x="360" y="134" text-anchor="middle" class="lbl2">tasa ≈ 19290123456790 wei/s</text>
  <text x="360" y="154" text-anchor="middle" class="lbl2">el empleado ve su pendiente subir</text>

  <rect x="510" y="80" width="170" height="90" rx="12" class="box"/>
  <text x="595" y="112" text-anchor="middle" class="lbl">3 · Pausar / reanudar</text>
  <text x="595" y="134" text-anchor="middle" class="lbl2">tramo liquidado al pausar</text>
  <text x="595" y="154" text-anchor="middle" class="lbl2">el fin se aplaza, no se pierde</text>

  <rect x="740" y="80" width="190" height="90" rx="12" class="ok"/>
  <text x="835" y="112" text-anchor="middle" class="lbl">4 · Terminar</text>
  <text x="835" y="134" text-anchor="middle" class="lbl2">deleteFlow: paga y devuelve</text>
  <text x="835" y="154" text-anchor="middle" class="lbl2">escrow queda a 0</text>

  <path class="arrow" d="M210,125 L270,125"/>
  <path class="arrow" d="M450,125 L510,125"/>
  <path class="arrow" d="M680,125 L740,125"/>

  <!-- Cobro -->
  <rect x="120" y="230" width="300" height="120" rx="12" class="ok"/>
  <text x="270" y="262" text-anchor="middle" class="lbl">Cobro (empleado, CU-16)</text>
  <text x="270" y="286" text-anchor="middle" class="lbl2">downgrade(BrltX) → quema BrltX</text>
  <text x="270" y="306" text-anchor="middle" class="lbl2">y entrega BRLT al empleado</text>
  <text x="270" y="332" text-anchor="middle" class="lbl2">incluso con contrato pausado (AC-07)</text>

  <path class="arrow" d="M360,175 C330,210 300,220 280,230"/>

  <!-- Liquidar -->
  <rect x="540" y="230" width="300" height="120" rx="12" class="step"/>
  <text x="690" y="262" text-anchor="middle" class="lbl">Liquidar flujo vencido (AC-02)</text>
  <text x="690" y="286" text-anchor="middle" class="lbl2">settleFlow público y sin permiso</text>
  <text x="690" y="306" text-anchor="middle" class="lbl2">solo si block.timestamp ≥ endsAt</text>
  <text x="690" y="332" text-anchor="middle" class="lbl2">acumulado → BrltX del empleado</text>

  <path class="arrow" d="M860,175 C760,220 720,220 690,230"/>

  <text x="480" y="395" text-anchor="middle" class="s">docs/imagenes/flujo-nomina.svg · Fase 5 · Superfluid Brlt Streaming v2</text>
</svg>
