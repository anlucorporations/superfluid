<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="system-ui,'Segoe UI',Arial" role="img" aria-label="Mapa relacional de la base de datos">
  <defs>
    <marker id="rm" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#338fff"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#ffffff}
    .card{fill:#f7faff;stroke:#c9dcf7;stroke-width:1.5}
    .hi{fill:#eaf3ff;stroke:#338fff;stroke-width:2}
    .count{fill:#eefaf3;stroke:#10b981;stroke-width:2}
    .h1{font-size:22px;font-weight:700;fill:#0f172a}
    .h2{font-size:13px;fill:#64748b}
    .lbl{font-size:15px;font-weight:700;fill:#0f172a}
    .mut{font-size:12px;fill:#475569}
    .rel{font-size:11.5px;font-weight:600;fill:#338fff}
    .arr{stroke:#338fff;stroke-width:2.2;fill:none;marker-end:url(#rm)}
    .arrG{stroke:#10b981;stroke-width:2.2;fill:none;stroke-dasharray:6 4;marker-end:url(#rm)}
    .note{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.2}
    .noteT{font-size:12px;fill:#475569}
  </style>
  <rect class="bg" width="960" height="480"/>
  <text x="480" y="40" text-anchor="middle" class="h1">El mapa de la base de datos</text>
  <text x="480" y="63" text-anchor="middle" class="h2">MongoDB guarda el papeleo · la cadena guarda el dinero · la auditoría cuenta el tope del 80%</text>

  <!-- proyectos -->
  <rect class="card" x="50" y="120" width="180" height="90" rx="12"/>
  <text x="140" y="150" text-anchor="middle" class="lbl">Proyectos</text>
  <text x="140" y="174" text-anchor="middle" class="mut">agrupa a varios empleados</text>
  <text x="140" y="193" text-anchor="middle" class="mut">info opcional</text>

  <!-- empleados -->
  <rect class="hi" x="300" y="120" width="180" height="90" rx="12"/>
  <text x="390" y="150" text-anchor="middle" class="lbl">Empleados</text>
  <text x="390" y="174" text-anchor="middle" class="mut">cada persona con su wallet</text>
  <text x="390" y="193" text-anchor="middle" class="mut">proyecto · ficha · perfil</text>

  <!-- programados -->
  <rect class="card" x="300" y="290" width="180" height="90" rx="12"/>
  <text x="390" y="320" text-anchor="middle" class="lbl">Programados</text>
  <text x="390" y="344" text-anchor="middle" class="mut">nómina apuntada</text>
  <text x="390" y="363" text-anchor="middle" class="mut">se lanza más adelante</text>

  <!-- lotes -->
  <rect class="card" x="60" y="290" width="150" height="90" rx="12"/>
  <text x="135" y="320" text-anchor="middle" class="lbl">Lotes</text>
  <text x="135" y="344" text-anchor="middle" class="mut">hasta 10 flujos de golpe</text>
  <text x="135" y="363" text-anchor="middle" class="mut">anti-duplicados</text>

  <!-- flujos -->
  <rect class="hi" x="550" y="120" width="180" height="90" rx="12"/>
  <text x="640" y="150" text-anchor="middle" class="lbl">Flujos</text>
  <text x="640" y="174" text-anchor="middle" class="mut">el «grifo» del salario</text>
  <text x="640" y="193" text-anchor="middle" class="mut">depositado · tasa · estado</text>

  <!-- historial -->
  <rect class="card" x="550" y="290" width="180" height="90" rx="12"/>
  <text x="640" y="320" text-anchor="middle" class="lbl">Historial</text>
  <text x="640" y="344" text-anchor="middle" class="mut">flows_history · eventos del contrato</text>
  <text x="640" y="363" text-anchor="middle" class="mut">incluida la despedida</text>

  <!-- auditoria -->
  <rect class="count" x="780" y="120" width="170" height="90" rx="12"/>
  <text x="865" y="150" text-anchor="middle" class="lbl">Auditoría</text>
  <text x="865" y="174" text-anchor="middle" class="mut">quién hizo qué y cuándo</text>
  <text x="865" y="193" text-anchor="middle" class="mut" style="fill:#10b981;font-weight:600">contador del tope 80%</text>

  <!-- jobs -->
  <rect class="card" x="780" y="290" width="170" height="90" rx="12"/>
  <text x="865" y="320" text-anchor="middle" class="lbl">Trabajos (jobs)</text>
  <text x="865" y="344" text-anchor="middle" class="mut">job_runs · auto-revisión</text>
  <text x="865" y="363" text-anchor="middle" class="mut">panel /admin/jobs</text>

  <!-- nota -->
  <rect class="note" x="330" y="420" width="300" height="36" rx="18"/>
  <text x="480" y="443" text-anchor="middle" class="noteT">nota: auto-revisión (los jobs re-reconstruyen desde el bloque inicial)</text>

  <!-- flechas -->
  <path class="arr" d="M232,165 L296,165"/>
  <text x="264" y="153" text-anchor="middle" class="rel">agrupa</text>
  <path class="arr" d="M420,212 L420,286"/>
  <text x="452" y="250" text-anchor="start" class="rel">tendrá</text>
  <path class="arr" d="M420,212 L420,286" style="display:none"/>
  <path class="arr" d="M480,165 L546,165"/>
  <text x="512" y="153" text-anchor="middle" class="rel">tiene</text>
  <path class="arr" d="M212,335 L296,335"/>
  <text x="254" y="323" text-anchor="middle" class="rel">crea</text>
  <path class="arr" d="M654,212 L654,286"/>
  <text x="686" y="252" text-anchor="start" class="rel">deja rastro</text>
  <path class="arrG" d="M732,165 L776,165"/>
  <text x="754" y="153" text-anchor="middle" class="rel" style="fill:#10b981">suma</text>
  <path class="arr" d="M940,290 C950,240 950,230 950,215" style="display:none"/>

  <text x="480" y="478" text-anchor="middle" font-size="11" fill="#94a3b8">docs/imagenes/relacional-map.svg · diagrama relacional (analistas) · actualizado 2026-11-17</text>
</svg>
