<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="system-ui,'Segoe UI',Arial" role="img" aria-label="Glosario visual de datos">
  <defs>
    <marker id="gv" markerWidth="9" markerHeight="9" refX="8" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L8,2.5 z" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="gh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1140"/><stop offset="1" stop-color="#3b2a7a"/>
    </linearGradient>
  </defs>
  <style>
    .bg{fill:#0d1425}
    .h1{font-size:22px;font-weight:700;fill:#e2e8f0}
    .h2{font-size:13px;fill:#94a3b8}
    .root{fill:url(#gh);stroke:#8b5cf6;stroke-width:2.5}
    .rootT{font-size:20px;font-weight:800;fill:#e2e8f0}
    .branch{fill:#1b1140;stroke:#8b5cf6;stroke-width:1.8}
    .bV{fill:#1b1140;stroke:#8b5cf6;stroke-width:1.8}
    .bG{fill:#0f2a24;stroke:#34d399;stroke-width:1.8}
    .bT{font-size:14.5px;font-weight:700;fill:#e2e8f0}
    .leaf{font-size:12px;fill:#94a3b8}
    .leafDot{fill:#a78bfa}
    .arr{stroke:#8b5cf6;stroke-width:1.8;fill:none;marker-end:url(#gv)}
    .arrG{stroke:#34d399;stroke-width:1.8;fill:none;marker-end:url(#gv)}
    .em{fill:#34d399;font-weight:600}
  </style>
  <rect class="bg" width="1000" height="620"/>
  <text x="500" y="40" text-anchor="middle" class="h1">Glosario visual — dónde vive cada cosa</text>
  <text x="500" y="63" text-anchor="middle" class="h2">Dos manos que trabajan juntas: la cadena guarda el dinero, MongoDB guarda el papeleo</text>

  <!-- raíz -->
  <rect class="root" x="420" y="285" width="160" height="70" rx="35"/>
  <text x="500" y="326" text-anchor="middle" class="rootT">Datos</text>

  <!-- CADENA -->
  <rect class="bV" x="80" y="110" width="250" height="120" rx="14"/>
  <text x="205" y="140" text-anchor="middle" class="bT">Cadena (lo que cuesta)</text>
  <text x="100" y="166" class="leaf"><tspan class="leafDot">·</tspan> Flujos y pagos</text>
  <text x="100" y="186" class="leaf"><tspan class="leafDot">·</tspan> Eventos (historial)</text>
  <text x="100" y="206" class="leaf"><tspan class="leafDot">·</tspan> Escrow y tasas</text>
  <text x="100" y="226" class="leaf"><tspan class="leafDot">·</tspan> Total asignado (<tspan class="em">tope 80%</tspan>)</text>

  <!-- MONGODB -->
  <rect class="bV" x="670" y="110" width="250" height="120" rx="14"/>
  <text x="795" y="140" text-anchor="middle" class="bT">MongoDB (papeleo)</text>
  <text x="690" y="166" class="leaf"><tspan class="leafDot">·</tspan> Empleados y proyectos</text>
  <text x="690" y="186" class="leaf"><tspan class="leafDot">·</tspan> Sesiones y permisos</text>
  <text x="690" y="206" class="leaf"><tspan class="leafDot">·</tspan> Auditoría (<tspan class="em">ya descargado</tspan>)</text>
  <text x="690" y="226" class="leaf"><tspan class="leafDot">·</tspan> Jobs y límites del tope</text>

  <!-- PORTAL -->
  <rect class="bG" x="80" y="400" width="250" height="100" rx="14"/>
  <text x="205" y="430" text-anchor="middle" class="bT">Portal del Empleado</text>
  <text x="100" y="456" class="leaf"><tspan class="leafDot" fill="#34d399">·</tspan> Resumen (3 números)</text>
  <text x="100" y="476" class="leaf"><tspan class="leafDot" fill="#34d399">·</tspan> Downgrade de flujos (4 fichas)</text>
  <text x="100" y="496" class="leaf"><tspan class="leafDot" fill="#34d399">·</tspan> Mi ficha · Mi perfil</text>

  <!-- DERECHOS -->
  <rect class="bG" x="670" y="400" width="250" height="100" rx="14"/>
  <text x="795" y="430" text-anchor="middle" class="bT">Tus derechos</text>
  <text x="690" y="456" class="leaf"><tspan class="leafDot" fill="#34d399">·</tspan> Borrado inmediato</text>
  <text x="690" y="476" class="leaf"><tspan class="leafDot" fill="#34d399">·</tspan> Anonimizado a los 30 días</text>
  <text x="690" y="496" class="leaf"><tspan class="leafDot" fill="#34d399">·</tspan> Retiro de lo tuyo hasta 90 días</text>

  <!-- conectores -->
  <path class="arr" d="M420,310 C330,300 300,260 220,234"/>
  <path class="arr" d="M580,310 C670,300 700,260 780,234"/>
  <path class="arrG" d="M420,340 C330,350 300,390 220,416"/>
  <path class="arrG" d="M580,340 C670,350 700,390 780,416"/>

  <!-- puente entre las dos manos -->
  <path d="M330,244 C420,266 580,266 666,244" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="500" y="262" text-anchor="middle" font-size="11.5" fill="#64748b">la app compara siempre las dos y se corrige si difieren</text>

  <text x="500" y="565" text-anchor="middle" class="leaf">Ejemplo del tope: asignado 10.000 → tope 8.000 → ya descargado 1.500 → disponible 6.500 BRLT</text>
  <text x="500" y="592" text-anchor="middle" font-size="11" fill="#64748b">docs/imagenes/glosario-visual.svg · diccionario de datos · actualizado 2026-11-17</text>
</svg>
