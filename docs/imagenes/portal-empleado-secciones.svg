<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="system-ui,'Segoe UI',Arial" role="img" aria-label="Secciones del Portal del Empleado">
  <defs>
    <marker id="ps" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="ph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1140"/><stop offset="1" stop-color="#3b2a7a"/>
    </linearGradient>
  </defs>
  <style>
    .bg{fill:#0d1425}
    .h1{font-size:22px;font-weight:700;fill:#e2e8f0}
    .h2{font-size:13px;fill:#94a3b8}
    .root{fill:url(#ph);stroke:#8b5cf6;stroke-width:2}
    .rootT{font-size:15px;font-weight:800;fill:#e2e8f0}
    .sec{fill:#131c30;stroke:#2a3a5c;stroke-width:1.5}
    .secV{fill:#1b1140;stroke:#8b5cf6;stroke-width:1.8}
    .secG{fill:#0f2a24;stroke:#34d399;stroke-width:1.8}
    .lbl{font-size:14px;font-weight:700;fill:#e2e8f0}
    .mut{font-size:11.5px;fill:#94a3b8}
    .arr{stroke:#8b5cf6;stroke-width:1.8;fill:none;marker-end:url(#ps)}
    .em{fill:#34d399;font-weight:700}
    .vi{fill:#a78bfa;font-weight:700}
  </style>
  <rect class="bg" width="980" height="640"/>
  <text x="490" y="40" text-anchor="middle" class="h1">Tu portal por dentro — secciones de /suite</text>
  <text x="490" y="63" text-anchor="middle" class="h2">De arriba abajo · refresco automático cada 5 s · identidad visual propia (azul noche + violeta)</text>

  <!-- raíz -->
  <rect class="root" x="390" y="285" width="200" height="70" rx="16"/>
  <text x="490" y="315" text-anchor="middle" class="rootT">Portal del Empleado</text>
  <text x="490" y="337" text-anchor="middle" class="mut" style="fill:#c4b5fd">/suite</text>

  <!-- Resumen -->
  <rect class="sec" x="55" y="105" width="215" height="110" rx="12"/>
  <text x="162" y="133" text-anchor="middle" class="lbl">Resumen</text>
  <text x="162" y="157" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> BRLT en saldo</text>
  <text x="162" y="177" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> Cobrable en BrltX</text>
  <text x="162" y="197" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> Salario por periodo</text>

  <!-- Downgrade -->
  <rect class="secV" x="383" y="105" width="215" height="130" rx="12"/>
  <text x="490" y="131" text-anchor="middle" class="lbl">Downgrade de flujos</text>
  <text x="490" y="153" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> 4 fichas del tope 80%</text>
  <text x="490" y="172" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> Selector de flujo</text>
  <text x="490" y="191" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> Botón «Máximo»</text>
  <text x="490" y="210" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> Botón «Descargar»</text>
  <text x="490" y="229" text-anchor="middle" class="mut" style="fill:#a78bfa">el cobro «con nómina»</text>

  <!-- Cobro autónomo -->
  <rect class="sec" x="710" y="105" width="215" height="110" rx="12"/>
  <text x="817" y="133" text-anchor="middle" class="lbl">Cobro autónomo</text>
  <text x="817" y="157" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> Convierte tu BrltX de cartera</text>
  <text x="817" y="177" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> sin elegir flujo</text>
  <text x="817" y="197" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> también cuenta para el tope</text>

  <!-- Mis flujos -->
  <rect class="sec" x="55" y="425" width="215" height="110" rx="12"/>
  <text x="162" y="453" text-anchor="middle" class="lbl">Mis flujos</text>
  <text x="162" y="477" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> estado y acumulado</text>
  <text x="162" y="497" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> «Descargar» por fila</text>
  <text x="162" y="517" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> activo · pausado · vencido · terminado</text>

  <!-- Mi ficha -->
  <rect class="sec" x="383" y="425" width="215" height="110" rx="12"/>
  <text x="490" y="453" text-anchor="middle" class="lbl">Mi ficha</text>
  <text x="490" y="477" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> proyecto · concepto</text>
  <text x="490" y="497" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> importe y periodo</text>
  <text x="490" y="517" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> solo lectura</text>

  <!-- Mi perfil -->
  <rect class="secG" x="710" y="425" width="215" height="110" rx="12"/>
  <text x="817" y="453" text-anchor="middle" class="lbl">Mi perfil</text>
  <text x="817" y="477" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> datos personales</text>
  <text x="817" y="497" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> consentimiento (fecha)</text>
  <text x="817" y="517" text-anchor="middle" class="mut"><tspan class="vi">·</tspan> <tspan class="em">Borrar mis datos</tspan> (inmediato)</text>

  <!-- conectores -->
  <path class="arr" d="M162,217 L162,421"/>
  <path class="arr" d="M340,133 L379,133"/>
  <path class="arr" d="M620,133 L706,133"/>
  <path class="arr" d="M340,180 C365,240 410,300 428,290" style="display:none"/>
  <path class="arr" d="M642,180 C640,280 560,320 592,300" style="display:none"/>
  <path class="arr" d="M340,490 L379,490"/>
  <path class="arr" d="M620,490 L706,490"/>
  <path class="arr" d="M490,285 L490,239"/>
  <path class="arr" d="M490,357 L490,421"/>

  <text x="490" y="585" text-anchor="middle" class="mut">La sesión está ligada a tu wallet: se revalida cada 10 s y al instante si MetaMask cambia de cuenta.</text>
  <text x="490" y="610" text-anchor="middle" font-size="11" fill="#64748b">docs/imagenes/portal-empleado-secciones.svg · manual del empleado · actualizado 2026-11-17</text>
</svg>
