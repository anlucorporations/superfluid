<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="system-ui,'Segoe UI',Arial" role="img" aria-label="Regla del tope del 80% en el panel admin">
  <defs>
    <marker id="ta" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#338fff"/>
    </marker>
    <marker id="tar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#ffffff}
    .card{fill:#f7faff;stroke:#c9dcf7;stroke-width:1.5}
    .hi{fill:#eaf3ff;stroke:#338fff;stroke-width:2}
    .okB{fill:#eefaf3;stroke:#10b981;stroke-width:2}
    .noB{fill:#fef2f2;stroke:#dc2626;stroke-width:2}
    .h1{font-size:22px;font-weight:700;fill:#0f172a}
    .h2{font-size:13px;fill:#64748b}
    .lbl{font-size:15px;font-weight:700;fill:#0f172a}
    .sub{font-size:12.5px;fill:#475569}
    .mut{font-size:12px;fill:#64748b}
    .rel{font-size:11.5px;font-weight:700;fill:#338fff}
    .arr{stroke:#338fff;stroke-width:2.2;fill:none;marker-end:url(#ta)}
    .arrR{stroke:#dc2626;stroke-width:2.2;fill:none;marker-end:url(#tar)}
  </style>
  <rect class="bg" width="980" height="520"/>
  <text x="490" y="40" text-anchor="middle" class="h1">El tope del 80% — regla de producto, aplicada al registrar el cobro</text>
  <text x="490" y="63" text-anchor="middle" class="h2">Lo que ve el administrador (Auditoría) y lo que ve el empleado (4 fichas)</text>

  <!-- flujos -->
  <rect class="card" x="45" y="110" width="215" height="100" rx="12"/>
  <text x="152" y="140" text-anchor="middle" class="lbl">Flujos del empleado</text>
  <text x="152" y="163" text-anchor="middle" class="sub">suma de depósitos</text>
  <text x="152" y="183" text-anchor="middle" class="sub">vivos + terminados</text>

  <!-- tope -->
  <rect class="hi" x="345" y="110" width="190" height="100" rx="12"/>
  <text x="440" y="140" text-anchor="middle" class="lbl">Tope del empleado</text>
  <text x="440" y="163" text-anchor="middle" class="sub">asignado × 80%</text>
  <text x="440" y="183" text-anchor="middle" class="sub">ej.: 10.000 → 8.000</text>

  <!-- auditoria -->
  <rect class="card" x="45" y="270" width="215" height="100" rx="12"/>
  <text x="152" y="300" text-anchor="middle" class="lbl">Auditoría</text>
  <text x="152" y="323" text-anchor="middle" class="sub">cobros verificados</text>
  <text x="152" y="343" text-anchor="middle" class="sub">contra la cadena</text>

  <!-- usado -->
  <rect class="hi" x="345" y="270" width="190" height="100" rx="12"/>
  <text x="440" y="300" text-anchor="middle" class="lbl">Ya descargado</text>
  <text x="440" y="323" text-anchor="middle" class="sub">suma de la auditoría</text>
  <text x="440" y="343" text-anchor="middle" class="sub">ej.: 1.500</text>

  <!-- disponible -->
  <rect class="hi" x="640" y="190" width="200" height="100" rx="12"/>
  <text x="740" y="220" text-anchor="middle" class="lbl">Disponible</text>
  <text x="740" y="243" text-anchor="middle" class="sub">tope − ya descargado</text>
  <text x="740" y="263" text-anchor="middle" class="sub">ej.: 8.000 − 1.500 = 6.500</text>

  <!-- ok -->
  <rect class="okB" x="700" y="370" width="270" height="90" rx="12"/>
  <text x="835" y="400" text-anchor="middle" class="lbl" style="fill:#10b981">Cobro OK → auditado</text>
  <text x="835" y="423" text-anchor="middle" class="sub">importe ≤ disponible</text>
  <text x="835" y="443" text-anchor="middle" class="sub">quién · cuánto · cuándo · tx</text>

  <!-- rechazo -->
  <rect class="noB" x="380" y="370" width="280" height="90" rx="12"/>
  <text x="520" y="400" text-anchor="middle" class="lbl" style="fill:#dc2626">Rechazo «tope_80_superado»</text>
  <text x="520" y="423" text-anchor="middle" class="sub">importe &gt; disponible</text>
  <text x="520" y="443" text-anchor="middle" class="sub">sin cobro · sin auditoría · sin huella</text>

  <!-- flechas -->
  <path class="arr" d="M262,160 L341,160"/>
  <text x="302" y="148" text-anchor="middle" class="rel">× 80%</text>
  <path class="arr" d="M262,320 L341,320"/>
  <text x="302" y="308" text-anchor="middle" class="rel">suma</text>
  <path class="arr" d="M537,160 C600,170 630,190 655,210"/>
  <path class="arr" d="M537,320 C600,310 630,290 655,270"/>
  <path class="arr" d="M760,292 L800,366"/>
  <text x="812" y="330" text-anchor="start" class="rel">importe ≤ disponible</text>
  <path class="arrR" d="M720,292 L620,366"/>
  <text x="670" y="352" text-anchor="middle" class="rel" style="fill:#dc2626">importe &gt; disponible</text>

  <!-- notas admin -->
  <rect x="45" y="470" width="900" height="0" rx="0"/>
  <text x="490" y="490" text-anchor="middle" class="mut">En Auditoría verás solo los cobros que pasaron el tope; los rechazados no dejan huella — pregúntale al empleado por el aviso «tope_80_superado».</text>
  <text x="490" y="508" text-anchor="middle" font-size="11" fill="#94a3b8">docs/imagenes/tope-80-admin.svg · manual del admin · actualizado 2026-11-17</text>
</svg>
