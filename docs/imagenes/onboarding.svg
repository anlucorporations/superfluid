<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui,'Segoe UI',Arial" role="img" aria-label="Onboarding: empezar en 5 minutos">
  <defs>
    <marker id="ob" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
    <marker id="obg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="obr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#fb7185"/>
    </marker>
    <linearGradient id="ohh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1140"/><stop offset="1" stop-color="#3b2a7a"/>
    </linearGradient>
  </defs>
  <style>
    .bg{fill:#0d1425}.card{fill:#131c30;stroke:#2a3a5c;stroke-width:1.5}
    .h1{font-size:22px;font-weight:700;fill:#e2e8f0}
    .h2{font-size:13px;fill:#94a3b8}
    .lbl{font-size:14.5px;font-weight:700;fill:#e2e8f0}
    .mut{font-size:12px;fill:#94a3b8}
    .step{font-size:11px;font-weight:800;fill:#a78bfa;letter-spacing:1px}
    .arr{stroke:#8b5cf6;stroke-width:2.2;fill:none;marker-end:url(#ob)}
    .arrG{stroke:#34d399;stroke-width:2.2;fill:none;marker-end:url(#obg)}
    .arrR{stroke:#fb7185;stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#obr)}
    .emp{fill:#131c30;stroke:#8b5cf6;stroke-width:2}
    .adm{fill:#131c30;stroke:#34d399;stroke-width:2}
    .em{fill:#34d399;font-weight:700}
    .vi{fill:#a78bfa;font-weight:700}
  </style>
  <rect class="bg" width="960" height="520"/>
  <text x="480" y="40" text-anchor="middle" class="h1">Empezar en 5 minutos — empleado y administrador</text>
  <text x="480" y="63" text-anchor="middle" class="h2">Una sola entrada (/entrar) · la wallet decide a qué portal ir</text>

  <!-- /entrar -->
  <rect class="card" x="380" y="100" width="200" height="80" rx="14" stroke="#8b5cf6" stroke-width="2"/>
  <text x="480" y="132" text-anchor="middle" class="lbl">/entrar</text>
  <text x="480" y="154" text-anchor="middle" class="mut">conecta MetaMask</text>
  <text x="480" y="172" text-anchor="middle" class="mut">la app pregunta tu rol</text>

  <!-- empleado -->
  <rect class="emp" x="80" y="250" width="330" height="160" rx="14"/>
  <text x="100" y="280" class="step">EMPLEADO</text>
  <text x="100" y="308" class="mut">1. conecta la wallet → rol: empleado</text>
  <text x="100" y="330" class="mut">2. firma SIWE → abre la sesión</text>
  <text x="100" y="352" class="mut">3. <tspan class="vi">/suite</tspan>: saldo · cobrable · salario</text>
  <text x="100" y="374" class="mut">4. «Downgrade de flujos» → «Descargar»</text>
  <text x="100" y="396" class="mut">→ BrltX pasa a <tspan class="em">BRLT real</tspan> (tope 80%)</text>

  <!-- admin -->
  <rect class="adm" x="550" y="250" width="330" height="160" rx="14"/>
  <text x="570" y="280" class="step" style="fill:#34d399">ADMINISTRADOR</text>
  <text x="570" y="308" class="mut">1. conecta la wallet admin → rol: admin</text>
  <text x="570" y="330" class="mut">2. <tspan class="em">/admin</tspan>: crea el empleado</text>
  <text x="570" y="352" class="mut">3. Flujos → «Aprobar y crear flujo»</text>
  <text x="570" y="374" class="mut">4. dos firmas: aprobar + crear</text>
  <text x="570" y="396" class="mut">→ el salario <tspan class="em">empieza a fluir</tspan></text>

  <!-- sin alta -->
  <rect x="330" y="440" width="300" height="56" rx="12" fill="#131c30" stroke="#fb7185" stroke-width="1.8"/>
  <text x="480" y="462" text-anchor="middle" class="mut" style="fill:#fb7185">sin alta → «pide alta al administrador»</text>
  <text x="480" y="482" text-anchor="middle" class="mut">vuelve a /entrar cuando la tengas</text>

  <!-- flechas -->
  <path class="arr" d="M450,182 C360,210 290,230 250,246"/>
  <path class="arrG" d="M510,182 C600,210 670,230 710,246"/>
  <path class="arrR" d="M480,182 L480,436"/>

  <text x="480" y="505" text-anchor="middle" font-size="11" fill="#64748b">docs/imagenes/onboarding.svg · manual principal · actualizado 2026-11-17</text>
</svg>
