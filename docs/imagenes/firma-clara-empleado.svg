<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="system-ui,'Segoe UI',Arial" role="img" aria-label="Firma clara del empleado: ficha en pantalla y mensaje SIWE en la wallet">
  <defs>
    <marker id="ce" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="ceh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1140"/><stop offset="1" stop-color="#3b2a7a"/>
    </linearGradient>
  </defs>
  <style>
    .bg{fill:#0d1425}.card{fill:#131c30;stroke:#2a3a5c;stroke-width:1.5}
    .h1{font-size:22px;font-weight:700;fill:#e2e8f0}
    .h2{font-size:13px;fill:#94a3b8}
    .lbl{font-size:14.5px;font-weight:700;fill:#e2e8f0}
    .mut{font-size:12px;fill:#94a3b8}
    .txt{font-size:12.5px;fill:#cbd5e1}
    .em{fill:#34d399;font-weight:700}
    .vio{fill:#a78bfa;font-weight:600}
    .step{fill:#131c30;stroke:#2a3a5c;stroke-width:1.5}
    .num{font-size:14px;font-weight:800;fill:#0d1425}
    .numB{fill:#8b5cf6}
    .arr{stroke:#8b5cf6;stroke-width:2.2;fill:none;marker-end:url(#ce)}
  </style>
  <rect class="bg" width="980" height="620"/>
  <text x="490" y="40" text-anchor="middle" class="h1">La firma clara: primero se te explica, después se firma</text>
  <text x="490" y="63" text-anchor="middle" class="h2">Portal del Empleado /suite · firmas de sesión y permisos, nunca a ciegas</text>

  <!-- izquierda: ficha en pantalla -->
  <rect class="card" x="60" y="95" width="420" height="300" rx="14"/>
  <rect x="60" y="95" width="420" height="46" rx="14" fill="url(#ceh)"/>
  <rect x="60" y="127" width="420" height="14" fill="url(#ceh)"/>
  <text x="270" y="124" text-anchor="middle" class="lbl">1 · En la pantalla — ficha de firma</text>
  <text x="85" y="170" class="txt" font-weight="700" fill="#e2e8f0">Conectar wallet</text>
  <line x1="85" y1="182" x2="455" y2="182" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="85" y="208" class="txt">Título de la operación y qué haces:</text>
  <text x="85" y="228" class="txt">abrir tu sesión en el portal.</text>
  <text x="85" y="256" class="txt">Wallet con la que firmas:</text>
  <text x="85" y="276" class="txt" font-family="monospace" fill="#a78bfa">0xAAA…1234 (tu cuenta de MetaMask)</text>
  <rect x="80" y="296" width="380" height="52" rx="10" fill="#1b1140" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="270" y="318" text-anchor="middle" class="txt" style="fill:#a78bfa;font-weight:700">«La firma es gratuita:</text>
  <text x="270" y="338" text-anchor="middle" class="txt" style="fill:#a78bfa;font-weight:700">no mueve fondos ni autoriza gastos»</text>
  <text x="85" y="378" class="mut">caduca a los 5 minutos · vuelve a pedirla si se pasa</text>

  <!-- derecha: mensaje en la wallet -->
  <rect class="card" x="500" y="95" width="420" height="320" rx="14"/>
  <rect x="500" y="95" width="420" height="46" rx="14" fill="url(#ceh)"/>
  <rect x="500" y="127" width="420" height="14" fill="url(#ceh)"/>
  <text x="710" y="124" text-anchor="middle" class="lbl">2 · En la wallet — mensaje SIWE explicado</text>
  <line x1="525" y1="170" x2="895" y2="170" stroke="#2a3a5c" stroke-width="1.5"/>
  <text x="525" y="212" class="txt" fill="#e2e8f0" font-style="italic">«Acceder a tu Portal del Empleado</text>
  <text x="525" y="236" class="txt" fill="#e2e8f0" font-style="italic">de Superfluid Brlt.</text>
  <text x="525" y="268" class="txt" fill="#e2e8f0" font-style="italic">Esta firma solo prueba que esta wallet</text>
  <text x="525" y="292" class="txt" fill="#e2e8f0" font-style="italic">es tuya.</text>
  <text x="525" y="324" class="txt" fill="#e2e8f0" font-style="italic">No mueve fondos ni autoriza gastos»</text>
  <rect x="520" y="344" width="380" height="42" rx="10" fill="#0f2a22" stroke="#34d399" stroke-width="1.4"/>
  <text x="710" y="370" text-anchor="middle" class="txt" style="fill:#34d399;font-weight:700">Firmar — coste 0</text>
  <text x="525" y="404" class="mut">la app ni siquiera usa el tipo de firma ciego (eth_sign),</text>
  <text x="525" y="422" class="mut">el que las wallets marcan como peligroso</text>

  <!-- pasos abajo -->
  <rect class="step" x="60" y="440" width="200" height="64" rx="12"/>
  <circle class="numB" cx="90" cy="472" r="14"/>
  <text x="90" y="477" text-anchor="middle" class="num">1</text>
  <text x="115" y="468" class="lbl" font-size="13">Pulsa «Conectar</text>
  <text x="115" y="486" class="lbl" font-size="13">wallet»</text>

  <rect class="step" x="290" y="440" width="200" height="64" rx="12"/>
  <circle class="numB" cx="320" cy="472" r="14"/>
  <text x="320" y="477" text-anchor="middle" class="num">2</text>
  <text x="345" y="468" class="lbl" font-size="13">Lees la ficha</text>
  <text x="345" y="486" class="lbl" font-size="13">explicada</text>

  <rect class="step" x="520" y="440" width="200" height="64" rx="12"/>
  <circle class="numB" cx="550" cy="472" r="14"/>
  <text x="550" y="477" text-anchor="middle" class="num">3</text>
  <text x="575" y="468" class="lbl" font-size="13">Firmas en MetaMask</text>
  <text x="575" y="486" class="lbl" font-size="13">sin coste</text>

  <rect x="750" y="440" width="170" height="64" rx="12" fill="#0f2a22" stroke="#34d399" stroke-width="1.8"/>
  <circle cx="780" cy="472" r="14" fill="#34d399"/>
  <text x="780" y="477" text-anchor="middle" class="num">4</text>
  <text x="805" y="468" class="lbl" font-size="13" fill="#34d399">Sesión abierta</text>
  <text x="805" y="486" class="lbl" font-size="13" fill="#34d399">en /suite</text>

  <path class="arr" d="M264,472 L286,472"/>
  <path class="arr" d="M494,472 L516,472"/>
  <path class="arr" d="M724,472 L746,472"/>

  <rect x="60" y="528" width="860" height="52" rx="10" fill="#1b1140" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="490" y="550" text-anchor="middle" class="txt">¿Y en las firmas que sí tocan dinero (crear flujos, cobrar, pausar…)? La pantalla dice el impacto real antes de firmar:</text>
  <text x="490" y="570" text-anchor="middle" class="txt vio">«Quemas X BrltX y recibes X BRLT» · «Descargas X BRLT del flujo #N. Tope del 80%: disponible Y BRLT»</text>

  <text x="490" y="606" text-anchor="middle" font-size="11" fill="#64748b">docs/imagenes/firma-clara-empleado.svg · vigente desde 2026-11-18</text>
</svg>
